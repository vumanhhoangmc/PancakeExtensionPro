<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pancake Assistant Pro</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Pancake Assistant Pro</h1>
      <p class="byline">By Bố Hoàng No1</p>
      <nav class="sections" role="tablist" aria-label="Nhóm tính năng">
        <button id="tab-pancake" type="button" role="tab" aria-controls="pane-pancake" class="active" aria-selected="true">Pancake</button>
        <button id="tab-poscake" type="button" role="tab" aria-controls="pane-poscake" aria-selected="false">POS Cake</button>
      </nav>
      <section id="pane-pancake" role="tabpanel" aria-labelledby="tab-pancake">
      <label class="feature second-feature">
        <span>
          <strong>Hỗ trợ trả lời comment</strong>
          <small>Điền lời nhắc vào comment. Sau khi bạn gửi, mở nhắn riêng bằng Alt+B và điền “/”. Bạn tự gửi nội dung.</small>
        </span>
        <input id="auto-comment-reply" type="checkbox" aria-label="Bật hỗ trợ trả lời comment">
      </label>
      <label class="feature">
        <span>
          <strong>Hỗ trợ lên đơn</strong>
          <small>Mở “Tạo mới” và chọn gợi ý địa chỉ đầu tiên khi bấm hội thoại.</small>
        </span>
        <input id="auto-order" type="checkbox" aria-label="Bật hỗ trợ lên đơn">
      </label>
      <label class="feature second-feature">
        <span>
          <strong>Tự điền ghi chú in</strong>
          <small>Khi bật miễn phí giao hàng, tóm tắt tên và số kg sản phẩm vào ghi chú in.</small>
        </span>
        <input id="auto-print-note" type="checkbox" aria-label="Bật tự điền ghi chú in">
      </label>
      <label class="feature second-feature">
        <span>
          <strong>Tự điều chỉnh giá Miến Sâm / Khoai</strong>
          <small>Khi bạn tích miễn phí giao hàng, áp bảng giá cho đơn chỉ có Miến Sâm hoặc Khoai Sọ Mán Mộc Châu. Khoai: 6kg 240k, 10kg 380k.</small>
        </span>
        <input id="auto-mien-sam-price" type="checkbox" aria-label="Bật tự điều chỉnh giá Miến Sâm và Khoai Sọ Mán Mộc Châu">
      </label>
      <label class="feature second-feature">
        <span>
          <strong>Tự tạo đơn</strong>
          <small>Sau khi điền và lưu ghi chú in, tự bấm “Tạo đơn”. Cần bật “Tự điền ghi chú in”.</small>
        </span>
        <input id="auto-submit-order" type="checkbox" aria-label="Bật tự tạo đơn">
      </label>
      <label class="feature second-feature">
        <span>
          <strong>Chuẩn hóa tag sau tạo đơn</strong>
          <small>Sau khi đơn được tạo, chỉ giữ “Đã Lên Đơn” và “Đã Gửi”. Áp dụng cả khi bạn tự bấm “Tạo đơn”.</small>
        </span>
        <input id="auto-order-tags" type="checkbox" aria-label="Bật chuẩn hóa tag sau tạo đơn">
      </label>
      <label class="feature second-feature">
        <span>
          <strong>AI tự lên đơn <em class="beta-badge">Beta</em></strong>
        <small>Nhận diện sản phẩm, địa chỉ và điền đơn nháp bằng ChatGPT Plus/Pro.</small>
        </span>
        <input id="ai-auto-order-beta" type="checkbox" aria-label="Bật AI tự lên đơn Beta" aria-describedby="ai-beta-status">
      </label>
      <p id="ai-beta-status" class="beta-status" role="status"></p>
      <button id="open-ai-settings" type="button">Kết nối ChatGPT / Thử AI</button>
      <section class="diagnostics">
        <h2>Kiểm tra giao diện</h2>
        <p>Ghi nhận cấu trúc của 4 phần tử bạn bấm, không lấy nội dung chat hoặc địa chỉ.</p>
        <button id="record-ui" type="button">Bắt đầu ghi nhận</button>
        <button id="copy-ui" type="button" disabled>Sao chép kết quả</button>
        <small id="record-status"></small>
      </section>
      </section>
      <section id="pane-poscake" role="tabpanel" aria-labelledby="tab-poscake" hidden>
        <label class="feature">
          <span>
            <strong>Phân nhóm đơn để in</strong>
            <small>Quét đơn trong bộ lọc POS hiện tại, gom theo sản phẩm và số kg từng loại. Chọn từng nhóm để in phiếu đơn gốc của POS.</small>
          </span>
          <input id="pos-group-print" type="checkbox" aria-label="Bật phân nhóm đơn POS Cake">
        </label>
        <p class="pos-hint">Sau khi bật, mở trang Đơn hàng của POS Cake và bấm “Phân nhóm đơn” ở góc dưới bên phải.</p>
      </section>
      <p id="site-status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
